#file: noinspection SpellCheckingInspection
name: abelohost-blog
services:
  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  app:
    image: abelohost-blog-php:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-blog}
      DB_USERNAME: ${DB_USERNAME:-blog}
      DB_PASSWORD: ${DB_PASSWORD:-local-blog-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      VISITOR_SECRET: ${VISITOR_SECRET:-}
    volumes:
      - .:/app
      - vendor:/app/vendor
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-blog}
      MYSQL_USER: ${DB_USERNAME:-blog}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-blog-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  views-worker:
    image: abelohost-blog-php:local
    command: ["cron", "-f"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-blog}
      DB_USERNAME: ${DB_USERNAME:-blog}
      DB_PASSWORD: ${DB_PASSWORD:-local-blog-password}
      REDIS_HOST: redis
    volumes:
      - .:/app:ro
      - vendor:/app/vendor:ro
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  db-test:
    image: mysql:8.4
    profiles: ["test"]
    environment:
      MYSQL_DATABASE: blog_test
      MYSQL_USER: blog_test
      MYSQL_PASSWORD: local-test-password
      MYSQL_ROOT_PASSWORD: local-test-root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
  tests:
    image: abelohost-blog-php:local
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: test
      DB_HOST: db-test
      DB_DATABASE: blog_test
      DB_USERNAME: blog_test
      DB_PASSWORD: local-test-password
      REDIS_HOST: redis-test
      REDIS_DATABASE: 0
      VISITOR_SECRET: test-only-visitor-secret-at-least-thirty-two-bytes
    volumes:
      - .:/app:ro
      - vendor:/app/vendor:ro
    tmpfs:
      - /app/storage
      - /app/.phpunit.cache
    command: ["sh", "-c", "php bin/migrate.php && vendor/bin/phpunit && vendor/bin/phpunit --configuration phpunit.integration.xml"]
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
  redis-test:
    image: redis:7.4-alpine
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  mysql-data:
  vendor:
  storage:
  redis-data:
